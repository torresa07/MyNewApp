<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atelier — Studio</title>
  <meta name="description" content="Your architecture studio organizer: projects, deadlines, design journal, final submission checklist and precedents." />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="../theme.css" />
  <script src="../theme.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="side" aria-label="Main navigation">
      <a href="../" class="brand">
        <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 29 L29 3 M16 3 V29" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span>Atelier</span>
      </a>
      <nav class="side__nav">
        <a href="#/dashboard" data-route="dashboard"><span class="ico" aria-hidden="true">◧</span><span class="lbl">Dashboard</span></a>
        <a href="#/projects" data-route="projects"><span class="ico" aria-hidden="true">▤</span><span class="lbl">Projects</span></a>
        <a href="#/calendar" data-route="calendar"><span class="ico" aria-hidden="true">▦</span><span class="lbl">Calendar</span></a>
        <a href="#/checklist" data-route="checklist"><span class="ico" aria-hidden="true">☑</span><span class="lbl"><span class="lbl-long">Final submission</span><span class="lbl-short">Final</span></span></a>
        <a href="#/journal" data-route="journal" data-more><span class="ico" aria-hidden="true">✎</span><span class="lbl">Journal</span></a>
        <a href="#/review" data-route="review" data-more><span class="ico" aria-hidden="true">◎</span><span class="lbl">Review</span></a>
        <a href="#/inspiration" data-route="inspiration" data-more><span class="ico" aria-hidden="true">❖</span><span class="lbl">Precedents</span></a>
        <button type="button" class="more-btn" id="moreBtn" aria-haspopup="true" aria-expanded="false"><span class="ico" aria-hidden="true">⋯</span><span class="lbl">More</span></button>
      </nav>
      <div class="more-sheet" id="moreSheet" hidden>
        <a href="#/journal" data-route="journal"><span class="ico" aria-hidden="true">✎</span>Journal &amp; mood board</a>
        <a href="#/review" data-route="review"><span class="ico" aria-hidden="true">◎</span>Review</a>
        <a href="#/inspiration" data-route="inspiration"><span class="ico" aria-hidden="true">❖</span>Precedents</a>
        <button type="button" data-open-settings><span class="ico" aria-hidden="true">⚙</span>Settings &amp; data</button>
      </div>
      <div class="side__foot">
        <button class="link-btn" id="settingsBtn" type="button">Settings &amp; data</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar__title" id="pageTitle">Dashboard</div>
        <div class="topbar__actions">
          <div data-theme-menu></div>
          <button class="icon-btn bell" id="bellBtn" type="button" aria-label="Upcoming deadline alerts">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <span class="bell__count" id="bellCount" hidden></span>
          </button>
          <button class="btn btn--small" id="quickNew" type="button">+ <span class="hide-sm">New project</span></button>
        </div>
        <div class="alerts-pop" id="alertsPop" hidden></div>
      </header>
      <div id="alertBanner"></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal" class="modal" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
