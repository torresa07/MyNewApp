<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atelier — Studio</title>
  <meta name="description" content="Your architecture studio organizer: projects, deadlines, design journal, final submission checklist and precedents." />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <script src="../theme.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="side" aria-label="Main navigation">
      <a href="../" class="brand">
        <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 29 L29 3 M16 3 V29" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span>Atelier</span>
      </a>
      <nav class="side__nav">
        <a href="#/dashboard" data-route="dashboard"><span class="ico">◧</span><span>Dashboard</span></a>
        <a href="#/projects" data-route="projects"><span class="ico">▤</span><span>Projects</span></a>
        <a href="#/calendar" data-route="calendar"><span class="ico">▦</span><span>Calendar</span></a>
        <a href="#/journal" data-route="journal"><span class="ico">✎</span><span>Journal</span></a>
        <a href="#/checklist" data-route="checklist"><span class="ico">☑</span><span>Final submission</span></a>
        <a href="#/review" data-route="review"><span class="ico">◎</span><span>Review</span></a>
        <a href="#/inspiration" data-route="inspiration"><span class="ico">❖</span><span>Precedents</span></a>
      </nav>
      <div class="side__foot">
        <button class="link-btn" id="settingsBtn" type="button">Settings &amp; data</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar__title" id="pageTitle">Dashboard</div>
        <div class="topbar__actions">
          <div class="theme-switch" role="group" aria-label="Colour theme">
          <button type="button" data-theme-value="light" aria-label="Light theme" title="Light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <button type="button" data-theme-value="dark" aria-label="Dark theme" title="Dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
          <button type="button" data-theme-value="system" aria-label="Match system theme" title="System"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg></button>
        </div>
          <button class="icon-btn bell" id="bellBtn" type="button" aria-label="Upcoming deadline alerts">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <span class="bell__count" id="bellCount" hidden></span>
          </button>
          <button class="btn btn--small" id="quickNew" type="button">+ <span class="hide-sm">New project</span></button>
        </div>
        <div class="alerts-pop" id="alertsPop" hidden></div>
      </header>
      <div id="alertBanner"></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal" class="modal" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
